<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <rect width="840" height="380" fill="#0d1117" rx="12" stroke="#30363d"/>
  
  <!-- Header -->
  <text x="32" y="40" fill="#f0f6fc" font-size="18" font-weight="600">Empirical Benchmark: Standard AI vs. SecondOpinion</text>
  <text x="32" y="62" fill="#8b949e" font-size="13">Tested on 5 High-Stakes Tech Dilemmas (Auth, Database, Cloud Infra, Frontend, Pricing)</text>
  
  <!-- Legend -->
  <rect x="540" y="28" width="14" height="14" fill="#da3633" rx="3"/>
  <text x="562" y="40" fill="#f85149" font-size="12">Standard AI (Single Agent)</text>
  
  <rect x="710" y="28" width="14" height="14" fill="#238636" rx="3"/>
  <text x="732" y="40" fill="#2ea043" font-size="12" font-weight="600">SecondOpinion</text>
  
  <!-- Grid Lines -->
  <line x1="240" y1="95" x2="780" y2="95" stroke="#21262d" stroke-dasharray="3,3"/>
  <line x1="240" y1="165" x2="780" y2="165" stroke="#21262d" stroke-dasharray="3,3"/>
  <line x1="240" y1="235" x2="780" y2="235" stroke="#21262d" stroke-dasharray="3,3"/>
  <line x1="240" y1="305" x2="780" y2="305" stroke="#30363d"/>
  
  <!-- Axis Labels -->
  <text x="240" y="325" fill="#8b949e" font-size="11" text-anchor="middle">0%</text>
  <text x="375" y="325" fill="#8b949e" font-size="11" text-anchor="middle">25%</text>
  <text x="510" y="325" fill="#8b949e" font-size="11" text-anchor="middle">50%</text>
  <text x="645" y="325" fill="#8b949e" font-size="11" text-anchor="middle">75%</text>
  <text x="780" y="325" fill="#8b949e" font-size="11" text-anchor="middle">100%</text>
  
  <!-- Metric 1: Flawed Plan Rejection Rate -->
  <text x="32" y="118" fill="#e6edf3" font-size="13" font-weight="500">Plan Rejection Rate</text>
  <text x="32" y="134" fill="#8b949e" font-size="11">(Refuses to validate flawed plan)</text>
  <rect x="240" y="102" width="1" height="14" fill="#da3633" rx="3"/>
  <text x="250" y="114" fill="#f85149" font-size="11">0.0% (Flattered user)</text>
  
  <rect x="240" y="122" width="540" height="14" fill="#238636" rx="3"/>
  <text x="785" y="134" fill="#3fb950" font-size="11" font-weight="600">100.0% (Pulls emergency brake)</text>
  
  <!-- Metric 2: Hidden Trap Detection -->
  <text x="32" y="188" fill="#e6edf3" font-size="13" font-weight="500">Hidden Trap Catch Rate</text>
  <text x="32" y="204" fill="#8b949e" font-size="11">(SOC 2, Support Drain, Race Cond.)</text>
  <rect x="240" y="172" width="108" height="14" fill="#da3633" rx="3"/>
  <text x="355" y="184" fill="#f85149" font-size="11">20.0% (Missed downstream traps)</text>
  
  <rect x="240" y="192" width="540" height="14" fill="#238636" rx="3"/>
  <text x="785" y="204" fill="#3fb950" font-size="11" font-weight="600">100.0% (Identified all traps)</text>
  
  <!-- Metric 3: Actionable Fix Delivery -->
  <text x="32" y="258" fill="#e6edf3" font-size="13" font-weight="500">Drop-in Fix & Proof</text>
  <text x="32" y="274" fill="#8b949e" font-size="11">(Severity + Exact Replacement)</text>
  <rect x="240" y="242" width="108" height="14" fill="#da3633" rx="3"/>
  <text x="355" y="254" fill="#f85149" font-size="11">20.0% (Conversational advice)</text>
  
  <rect x="240" y="262" width="540" height="14" fill="#238636" rx="3"/>
  <text x="785" y="274" fill="#3fb950" font-size="11" font-weight="600">100.0% (Structured Challenge Record)</text>
  
  <!-- Footer -->
  <text x="32" y="358" fill="#8b949e" font-size="11">Key Takeaway: Standard AI agrees with bad ideas 80% of the time. SecondOpinion catches downstream financial, security, and scaling traps.</text>
</svg>
